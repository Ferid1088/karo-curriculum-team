# Start:  docker compose run --rm kcteam            (fragt nach dem Fach)
#         docker compose run --rm kcteam status
#         docker compose run --rm kcteam review list
#
# Nutzt Karo schon Supabase/Postgres? Dann DATABASE_URL in .env darauf zeigen lassen
# und den Dienst "postgres" weglassen:  docker compose run --rm --no-deps kcteam
#
# Curriculum-Service für Karo (HTTP-API + Agent, laufen dauerhaft):
#         docker compose --profile agent up -d
#         docker compose run --rm kcteam api-client add --name karo      (Schlüssel für Karo, einmalig)
# Datenbank-Browser (nur lesen, http://127.0.0.1:8090, braucht ADMIN_PASSWORD in .env):
#         docker compose --profile admin up -d
#
# Stoppen:
#   docker compose down        <- normal. Container weg, Daten bleiben.
#   docker compose down -v     <- GEFAEHRLICH: loescht auch die Volumes und damit
#                                 die Entwicklungsdatenbank. Gehoert in keinen
#                                 normalen Arbeitsablauf. Siehe README.
#
# Tests:  docker compose --profile test up -d postgres-test
#         TEST_DATABASE_URL=postgresql://karo:karo@127.0.0.1:5434/karo_curriculum_test \
#           APP_ENV=test ALLOW_DESTRUCTIVE_DB_RESET=YES python -m tools.reset_test_db --create

# Gemeinsame Grenze fuer die dauerhaft laufenden Dienste: stdout-Logs
# rotieren bei 20 MB pro Datei, hoechstens 3 Dateien — ein Dauerfehler
# darf die Platte nicht fuellen. Fachliche Historie liegt in Postgres,
# nicht in diesen Zeilen.
x-logging: &app-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: karo
      POSTGRES_PASSWORD: karo
      POSTGRES_DB: karo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # nur auf deinem Rechner erreichbar; anderer Port, falls 5432 schon belegt ist (POSTGRES_HOST_PORT in .env)
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karo"]
      interval: 3s
      retries: 20

  # Datenbank NUR fuer Tests. Eigener Container, eigenes Volume, eigener Port,
  # eigener Datenbankname auf "_test" — damit ein Testlauf die Entwicklungs-
  # datenbank technisch nicht erreichen kann, selbst bei falsch gesetzter
  # Variable. Start:  docker compose --profile test up -d postgres-test
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: karo
      POSTGRES_PASSWORD: karo
      POSTGRES_DB: karo_curriculum_test
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_TEST_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karo -d karo_curriculum_test"]
      interval: 3s
      retries: 20
    profiles: ["test"]

  kcteam:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    volumes:
      - karo_data:/karo:ro        # Karo-Spec / Dokumente (nur lesen)
      - karo_export:/karo-export  # Stufe 1: curriculum.db für das Karo-MVP (sonst ungenutzt)
      - ./data:/data              # Exporte und Logs
    profiles: ["cli"]             # nur per "docker compose run --rm kcteam …", nicht bei "up"

  curriculum-agent:
    build: .
    command: ["serve"]
    env_file: .env
    logging: *app-logging
    restart: unless-stopped
    stop_grace_period: 60s        # laufende KI-Aufrufe sauber beenden
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - karo_data:/karo:ro
      - karo_export:/karo-export
      - ./data:/data
    profiles: ["agent"]

  curriculum-api:
    build: .
    command: ["api"]
    env_file: .env
    environment:
      KCTEAM_API_HOST: 0.0.0.0
      KCTEAM_API_PORT: "8088"
      KCTEAM_API_WORKERS: ${KCTEAM_API_WORKERS:-2}
    logging: *app-logging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KCTEAM_API_HOST_PORT:-8088}:8088"   # nur auf deinem Rechner
    networks: [default, karo-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=2)"]
      interval: 10s
      retries: 5
    profiles: ["agent"]

  admin:
    build: .
    command: ["admin"]
    env_file: .env
    environment:
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: "8090"
      KARO_DB_PATH: ${KARO_DB_PATH:-/karo/karo.db}
    logging: *app-logging
    restart: on-failure:3
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-8090}:8090"         # nur auf deinem Rechner
    volumes:
      - karo_data:/karo:ro        # Karos Datenbank, nur lesen
    profiles: ["admin"]

networks:
  # Karo erreicht den Dienst als http://curriculum-api:8088 (Karo: docker-compose.curriculum.yml)
  karo-net:
    name: karo-net

volumes:
  # Entwicklungsdaten. Wird NIE von Tests benutzt.
  pgdata:
  # Testdaten, strikt getrennt. Nur dieses Volume darf ein Reset treffen.
  pgdata_test:
  # Karos Volume (Spec lesen). Gibt es das Volume schon (Karo läuft), wird es mitbenutzt, sonst neu angelegt.
  karo_data:
    name: ${KARO_VOLUME:-karo_karo-data}
  # Stufe 1: das Volume, das Karo unter /data einbindet (dort landet curriculum.db). Standard: wie KARO_VOLUME.
  karo_export:
    name: ${KARO_EXPORT_VOLUME:-${KARO_VOLUME:-karo_karo-data}}
