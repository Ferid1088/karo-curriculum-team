    name: Evangelische Religion
    code: RE
    aliases: [evangelische religion, ev religion, ev. religion, religion evangelisch, evangelischer religionsunterricht]
    family: religion_ethik
    grades: [1, 13]
    notes: Konfessioneller Unterricht nach Art. 7 Abs. 3 GG aus evangelischer Perspektive, mit ökumenischer und interreligiöser Offenheit.

  - id: religion_katholisch
    name: Katholische Religion
    code: RK
    aliases: [katholische religion, kath religion, kath. religion, religion katholisch, katholischer religionsunterricht]
    family: religion_ethik
    grades: [1, 13]
    notes: Konfessioneller Unterricht nach Art. 7 Abs. 3 GG aus katholischer Perspektive, mit ökumenischer und interreligiöser Offenheit.

  - id: religion_islamisch
    name: Islamische Religion
    code: RI
    aliases: [islamische religion, islamischer religionsunterricht, islamunterricht, islamkunde]
    family: religion_ethik
    grades: [1, 13]
    notes: Bekenntnisorientierter islamischer Religionsunterricht (je nach Land), innerislamische Vielfalt beachten.

  - id: religion_juedisch
    name: Jüdische Religion
    code: RJ
    aliases: [jüdische religion, juedische religion, jüdischer religionsunterricht]
    family: religion_ethik
    grades: [1, 13]

  - id: ethik
    name: Ethik
    code: ET
    aliases: [werte und normen, praktische philosophie, ler, lebensgestaltung-ethik-religionskunde, philosophieren mit kindern]
    family: religion_ethik
    grades: [1, 13]
    notes: Bekenntnisfreies Fach (Name je nach Land). Philosophieren mit Kindern in der Grundschule, später Ethik, Religionskunde, Anthropologie.

  - id: philosophie
    name: Philosophie
    code: PHI
    aliases: [philosophy]
    family: religion_ethik
    grades: [10, 13]
    notes: "Oberstufe: Erkenntnistheorie, Ethik, Anthropologie, Staatsphilosophie, Sprachphilosophie; Argumentationsanalyse."

