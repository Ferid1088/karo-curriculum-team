# Der Vertragstest gegen den echten Abnehmer laeuft hier nicht "wenn moeglich",
# sondern immer. Genau das hat gefehlt: beide Seiten waren fuer sich gruen,
# und trotzdem passten die Fassungen im Betrieb nicht zueinander.
name: pytest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Testdatenbank: der Name endet auf _test, sonst verweigert kcteam.dbsafety
  # jeden zerstoererischen Schritt.
  TEST_DATABASE_URL: postgresql://karo:karo@127.0.0.1:5432/karo_curriculum_test
  APP_ENV: test
  ALLOW_DESTRUCTIVE_DB_RESET: "YES"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: karo
          POSTGRES_PASSWORD: karo
          POSTGRES_DB: karo_curriculum_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U karo -d karo_curriculum_test"
          --health-interval 3s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      # Der Abnehmer daneben. Ohne ihn liefe der Vertragstest nur als "skipped"
      # durch – und ein uebersprungener Vertragstest ist kein Vertragstest.
      - uses: actions/checkout@v4
        with:
          repository: Ferid1088/karo
          path: karo-app
          token: ${{ secrets.KARO_APP_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r karo-app/requirements.txt
          # karo-contract aus dem Checkout daneben, nicht aus master: geprueft
          # wird der Stand, gegen den dieser Lauf faehrt.
          pip install -e ./karo-app

      - name: Testdatenbank stempeln
        run: python -m tools.reset_test_db --create --no-backup

      - name: Suite
        env:
          KARO_APP_PATH: ${{ github.workspace }}/karo-app
          KARO_DATA_DIR: ${{ runner.temp }}/karo-data
        run: pytest -q

      # Ein uebersprungener Vertragstest saehe gruen aus und prueft nichts.
      # Deshalb hier einzeln, und "skipped" gilt als Fehler.
      - name: Vertragstest gegen den echten Abnehmer
        env:
          KARO_APP_PATH: ${{ github.workspace }}/karo-app
          KARO_DATA_DIR: ${{ runner.temp }}/karo-data-vertrag
        run: |
          set -o pipefail
          pytest tests/test_karo_bridge_contract.py -rs | tee vertrag.log
          if grep -qi "skipped" vertrag.log; then
            echo "::error::Der Vertragstest wurde uebersprungen – das zaehlt als Fehler."
            exit 1
          fi
