[project]
name = "karo-curriculum-team"
version = "0.1.0"
description = "Agenten-Team, das Karos Wissensbasis (Klasse 1–13) erzeugt, prüft und in die Datenbank schreibt"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1",
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.0"]

[project.scripts]
kcteam = "kcteam.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kcteam*"]

[tool.setuptools.package-data]
kcteam = ["prompts/*.md", "sql/*.sql", "subjects/*.yaml", "subjects/families/*.yaml"]
