[project]
name = "karo-curriculum-team"
version = "0.1.0"
description = "Agenten-Team, das Karos Wissensbasis (Klasse 1–13) erzeugt, prüft und in die Datenbank schreibt"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1",
    "anthropic>=0.40",
    "openai>=1.50",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "jsonschema>=4.21",
    "httpx>=0.27",
    # Die echte Pruefung des Abnehmers Karo, statt eines Nachbaus davon.
    "karo-contract @ git+https://github.com/Ferid1088/karo.git@contract-v1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.0"]

[project.scripts]
kcteam = "kcteam.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kcteam*"]

[tool.setuptools.package-data]
kcteam = ["prompts/*.md", "sql/*.sql", "subjects/*.yaml", "subjects/families/*.yaml", "admin/templates/*.html"]

[tool.pytest.ini_options]
# `tools` (der Reset der Testdatenbank) liegt neben `kcteam` im Baum, wird aber
# nicht mitinstalliert. Ohne diese Zeile findet es nur, wer pytest als
# `python -m pytest` aufruft — in der CI laeuft es als Programm, und dort
# schlugen 77 Tests mit ModuleNotFoundError fehl.
pythonpath = ["."]
# Nur die eigenen Tests. In der CI liegt Karos Repository als Unterordner
# daneben (fuer den Vertragstest); ohne diese Zeile sammelt pytest dessen
# Tests gleich mit und fuehrt sie im falschen Arbeitsverzeichnis aus.
testpaths = ["tests"]
