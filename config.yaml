# Karo Curriculum Team – Konfiguration
# Werte in ${VAR} werden aus Umgebungsvariablen (.env) gelesen.

# Welcher KI-Zugang benutzt wird. Beim interaktiven Start kann man ihn auch wählen.
# Möglich: claude_token | anthropic_api | openrouter | openai | devin | mock
# KCTEAM_AI_PROVIDER (Umgebung) hat Vorrang vor dieser Zeile.
provider: ${KCTEAM_PROVIDER:-claude_token}

providers:
  # Claude-Abo-Token (claude setup-token -> CLAUDE_CODE_OAUTH_TOKEN), läuft über die claude CLI
  claude_token:
    default_model: sonnet
    web_search: true
    timeout_s: 600
  # Claude API mit API-Key (ANTHROPIC_API_KEY)
  anthropic_api:
    default_model: claude-sonnet-4-5
    web_search: true
    max_tokens: 16000
  # OpenRouter (OPENROUTER_API_KEY) – beliebige Modelle, Websuche über ":online"
  openrouter:
    default_model: anthropic/claude-sonnet-4.5
    web_search: true
    max_tokens: 16000
  # OpenAI / GPT-Codex (OPENAI_API_KEY) über die Responses API
  openai:
    default_model: gpt-5-codex
    web_search: true
  # Devin API (DEVIN_API_KEY) – asynchron: ein Modellaufruf ist eine Devin-
  # Session; das Ergebnis holt der nächste Worker-Lauf als structured_output.
  # Ein Auftrag wartet dazwischen in der Warteschlange (kein Versuch verbraucht).
  devin:
    default_model: devin              # Devin waehlt sein Modell selbst; nur Kennung fuer Logs
    base_url: https://api.devin.ai/v1
    poll_seconds: 300                 # so früh fragt der Worker die Session erneut ab
    max_session_seconds: 7200         # danach wird die Session aufgegeben
    timeout_s: 60                     # HTTP-Timeout fuer create/status/message
    max_session_restarts: 1           # abgelaufene/fehlgeschlagene Session neu starten
    # max_acu_limit: 20               # optionaler Kostenrahmen pro Devin-Session
  # Offline-Testmodus ohne KI-Kosten
  mock:
    default_model: mock

# Faehigkeit -> Modell pro Provider (PART 15-16). Die Domaenenlogik kennt
# nur Faehigkeiten (reasoning_xhigh, writing_high …); hier wird die
# konkrete Modellwahl festgelegt. Reihenfolge bei der Aufloesung:
# role_models > capabilities > default_model. Die OpenRouter-Basis ist die
# Anfangshypothese – Benchmarking kann sie anheben oder absenken.
capabilities:
  openrouter:
    reasoning_xhigh: openai/gpt-5.1
    reasoning_high: openai/gpt-5.1
    reasoning_balanced: openai/gpt-5-mini
    writing_high: anthropic/claude-sonnet-4.5
    high_volume: openai/gpt-5-mini
    multimodal_high: anthropic/claude-sonnet-4.5
    image_generation: openai/gpt-image-1
  claude_token:
    reasoning_xhigh: opus
    reasoning_high: opus
    reasoning_balanced: sonnet
    writing_high: sonnet
    high_volume: haiku
    multimodal_high: opus
  anthropic_api:
    reasoning_xhigh: claude-opus-4-1
    reasoning_high: claude-opus-4-1
    reasoning_balanced: claude-sonnet-4-5
    writing_high: claude-sonnet-4-5
    high_volume: claude-haiku-4-5
    multimodal_high: claude-opus-4-1
  openai:
    reasoning_xhigh: gpt-5.1
    reasoning_high: gpt-5.1
    reasoning_balanced: gpt-5-mini
    writing_high: gpt-5.1
    high_volume: gpt-5-mini
    multimodal_high: gpt-5.1
    image_generation: gpt-image-1
  mock: {}
  devin: {}

# Tokenbudget je Fabrik-Rolle (PART 17); fehlende Eintraege nehmen die
# eingebauten Anfangswerte in kcteam/capabilities.py.
role_token_budget:
  # lernsimulator: 6000      # Beispiel-Override

# Modell pro Rolle (optional). Leer = Faehigkeit->Modell, dann default_model.
# Der Inspektor sollte das stärkste Modell bekommen.
role_models:
  claude_token:
    kinderrechts_inspektor: opus
    kritiker: opus
    visual_didaktiker: opus
  anthropic_api:
    kinderrechts_inspektor: claude-opus-4-1
  openrouter:
    kinderrechts_inspektor: anthropic/claude-opus-4.1
  openai: {}
  mock: {}

database:
  # Arbeitsdatenbank des Teams (immer Postgres).
  #   Stufe 1: lokaler Postgres-Container (docker compose)
  #   Stufe 2: Supabase/Neon EU – dieselbe Datenbank, die Karo nutzt (siehe README „Datenbank für Karo“)
  url: ${DATABASE_URL:-postgresql://karo:karo@localhost:5432/karo}

# Stufe 1 (Karo-MVP mit SQLite): nach jedem Lauf / Auftrag alle freigegebenen Inhalte als SQLite-Datei
# in Karos Volume schreiben. Karo liest sie mit: ATTACH DATABASE '/data/curriculum.db' AS cur;
sqlite_export:
  enabled: ${KARO_SQLITE_EXPORT:-false}
  path: ${KARO_SQLITE_PATH:-/karo-export/curriculum.db}

# Karo-Spezifikation vom gemeinsamen Volume (wird beim Lauf gelesen, falls vorhanden).
# Datei oder Ordner; bei einem Ordner werden alle .md-Dateien gelesen.
karo_spec_path: ${KARO_SPEC_PATH:-/karo}
karo_spec_max_chars: 12000

pipeline:
  default_grades: [1, 13]      # nur Rückfall; normalerweise gilt der Klassenbereich aus dem Fachprofil
  max_inspector_rounds: 3     # danach: gesperrt -> Mensch
  max_critic_rounds: 1        # Überarbeitungsrunden nach Kritiker
  max_json_retries: 2         # erneuter Versuch bei ungültigem JSON
  parallel_concepts: 4        # Konzepte, die gleichzeitig bearbeitet werden
  include_prerequisites: true # bei Klassenauswahl auch nötige Voraussetzungen aus tieferen Klassen bearbeiten
  visuals: true               # Visual-Didaktiker einsetzen
  max_agent_calls: 3000       # Budget-Obergrenze pro Lauf
  provider_retries: 5         # Wiederholungen bei vorübergehenden Anbieterfehlern
  max_retry_wait: 300         # längste Wartezeit (Sekunden) zwischen zwei Versuchen
  critic_chunk: 8             # Konzepte pro Kritiker-Aufruf

# Curriculum-Agent (kcteam serve): Aufträge von Karo, wenn zu einem Arbeitsblatt nichts passt.
# Such-Schwellen, Tageslimit usw. stehen in der Datenbank: curriculum.request_policy
ondemand:
  poll_seconds: 30            # Rückfall-Abfrage, falls eine NOTIFY-Nachricht verloren geht
  fast_lane: true             # erst ohne Visuals freigeben (schneller für das wartende Kind), Visuals danach
  prefetch_next: 1            # wahrscheinlich nächstes Thema vorab beauftragen (0 = aus)
  max_attempts: 3             # Fehlversuche pro Auftrag, danach 'failed'
  allow_unknown_subjects: false

# Betriebsgrenzen, ab denen ein Zustand Aufmerksamkeit verdient. `kcteam doctor`
# wertet sie gegen die Datenbank aus — sie sind Dokumentation UND Schranke,
# keine Magie im Code. Kein Wert schaltet etwas ab: sie melden, Menschen
# entscheiden (Rollback ist eine bewusste Handlung, kein Automatismus).
alerts:
  # Eine provider_session oder ein Export, die laenger "working"/"queued"
  # steht, als ein ganzer Devin-Lauf dauern duerfte, steckt vermutlich fest.
  stuck_session_minutes: 150
  pending_export_minutes: 120
  # Verwirft der Import oder die Pruefkette einen Grossteil der Lieferungen,
  # stimmt etwas am Format oder an der Autoren-Anleitung nicht.
  validation_reject_rate: 0.30     # Anteil der letzten 50 Exporte
  # Verliert der Anbieter Sessions haeufig, deutet das auf Zugangs- oder
  # Stabilitaetsprobleme — nicht auf einzelne Ausreisser.
  missing_remote_rate: 0.20        # Anteil der letzten 50 Sessions
  # Ein KI-Aufruf aus dem Kinder-Lernpfad von Karo verletzt die
  # Kernarchitektur — der Wert ist absichtlich 0 und bleibt es.
  runtime_ai_calls: 0

export_dir: ${KCTEAM_EXPORT_DIR:-/data/export}
